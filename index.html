<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3cc9c4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ocean Restoration" />
    <meta name="description" content="A cozy idle game: clean a polluted beach and watch the ocean come back to life." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Ocean Restoration</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="pills">
          <div class="pill" id="pill-coins"><span class="pi coin"></span><div><b id="coins">0</b><small id="coins-rate">+0/min</small></div></div>
          <div class="pill" id="pill-waste"><span class="pi">♻️</span><div><b id="waste">0</b><small id="waste-rate">+0/min</small></div></div>
          <div class="pill small" id="pill-rep"><span class="pi">⭐</span><div><b id="rep">0</b><small>rep</small></div></div>
        </div>
        <div class="restore">
          <div class="restore-top"><span>🏝️ Tropical Beach</span><b id="pct">0.0%</b></div>
          <div class="bar"><div class="fill" id="pct-fill"></div><i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i></div>
        </div>
      </header>

      <main id="stage">
        <canvas id="scene"></canvas>
        <div id="toasts"></div>
        <button id="life-chip" type="button" aria-label="Marine life collection">🐢 <span id="life-count">0/12</span></button>
        <div id="hint"></div>
        <section id="sheet" aria-hidden="true">
          <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" type="button" aria-label="Close">✕</button></div>
          <div id="sheet-body"></div>
        </section>
      </main>

      <nav id="nav">
        <button type="button" data-tab="beach" class="on"><span>🏖️</span>Beach</button>
        <button type="button" data-tab="equipment"><span>🧰</span>Equipment<i></i></button>
        <button type="button" data-tab="automation"><span>🚤</span>Automation<i></i></button>
        <button type="button" data-tab="research"><span>🔬</span>Research<i></i></button>
        <button type="button" data-tab="map"><span>🗺️</span>Ocean Map<i></i></button>
      </nav>

      <div id="modal" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
